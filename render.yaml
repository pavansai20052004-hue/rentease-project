services:
  - type: web
    name: rentease-backend
    runtime: node
    plan: free
    region: singapore
    branch: codex/upgrade-rentease-ui
    buildCommand: cd rentease-backend && npm ci
    startCommand: cd rentease-backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
